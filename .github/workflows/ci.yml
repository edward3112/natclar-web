# Pipeline de CI: se ejecuta en cada Pull Request y en cada push a main.
# Si alguna prueba falla, el PR queda en rojo y no se debe integrar.
name: CI - Pruebas automatizadas

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  pruebas:
    name: Lint, unitarias, integración y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (calidad de código)
        run: npm run lint

      - name: Compilar
        run: npm run build

      - name: Pruebas unitarias + integración + componente + regresión (con cobertura)
        run: npm run test:coverage

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage

  e2e:
    name: Pruebas E2E (Playwright)
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar navegador
        run: npx playwright install --with-deps chromium

      - name: Ejecutar E2E
        run: npm run test:e2e

      - name: Publicar reporte E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: playwright-report
